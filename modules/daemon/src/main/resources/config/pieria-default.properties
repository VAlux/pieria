# Pieria configuration
#
# This file was written to your config directory on first daemon start. Edit it to
# customize the daemon, then restart Pieria for the changes to take effect.
#
# Precedence: values here override the daemon's built-in defaults, but are themselves
# overridden by command-line arguments the installed service passes (host, port, paths).
# Delete this file to fall back to the built-in defaults.
#
# Only the commonly-tuned settings are listed below. Any pieria.* property accepted by
# the daemon can be added here.

# --- Model provider (OpenAI-compatible API: Ollama, LM Studio, llama.cpp, vLLM, OpenRouter, OpenAI) ---
# pieria.provider.base-url: The API endpoint root URL WITHOUT /v1 suffix (the client appends it automatically).
#   Examples: http://127.0.0.1:11434 (Ollama), http://localhost:8000 (LM Studio), https://api.openai.com (OpenAI)
pieria.provider.base-url=http://127.0.0.1:11434

# pieria.provider.api-key: Authentication token forwarded as the Bearer token in requests.
#   For local providers (Ollama, LM Studio, llama.cpp, vLLM), this is often ignored but must be non-blank.
#   For remote providers (OpenAI, OpenRouter), use your actual API key here.
pieria.provider.api-key=ollama

# pieria.provider.name: Display-only label shown in logs and UI to identify the active provider.
#   Does not affect functionality; purely for readability when managing multiple providers.
pieria.provider.name=ollama

# pieria.provider.type: Wire protocol dialect used to communicate with the provider.
#   Options: openai (default) | azure
#   - openai: Standard OpenAI-compatible protocol (used by Ollama, LM Studio, llama.cpp, vLLM, OpenRouter, OpenAI)
#   - azure: Azure OpenAI or Microsoft Foundry protocol; base-url becomes the Azure resource endpoint
#            (https://<resource>.openai.azure.com) and model names are Azure deployment names.
pieria.provider.type=openai

# pieria.provider.api-version: Azure REST API version; only used when type=azure.
#   Required for Azure OpenAI. Examples: 2024-10-21, 2024-08-01, 2024-06-01
#   Ignored when type=openai.
pieria.provider.api-version=2024-10-21

# --- Models ---
# pieria.model.extraction-model: Small/fast model used for structured, deterministic stages.
#   Drives extraction (summarization), verification (fact-checking), classification (memory type/topic),
#   and graph query analysis. Reasoning is disabled for these stages (see pieria.model.reasoning.structured).
#   Use fast models here; latency is critical. Examples: qwen3.5:9b, mistral-7b, neural-chat-7b
pieria.model.extraction-model=qwen3.5:9b-mlx

# pieria.model.synthesis-model: Large model used only for synthesis (final answer generation).
#   Called once per recall to synthesize memories into a coherent answer. Reasoning is disabled by default.
#   Use more capable models here; this is where the quality matters. Examples: gemma4:12b, qwen2.5:14b, llama3:8b-instruct
pieria.model.synthesis-model=gemma4:12b-mlx

# pieria.model.embedding: Embedding model used to vectorize memories for semantic search.
#   Must support the dimension specified in pieria.model.embedding-dimension.
#   Examples: mxbai-embed-large (1024d), nomic-embed-text (768d), bge-small (384d)
pieria.model.embedding=mxbai-embed-large

# pieria.model.embedding-dimension: Vector dimension for embeddings (column width in database).
#   ⚠️ CRITICAL: Once memories are embedded, changing this requires re-embedding all vectors.
#   Decide this value once and do not change it without a full re-index.
#   Common values: 384 (small), 768 (medium), 1024 (large). Match your embedding model's output dimension.
pieria.model.embedding-dimension=1024

# Per-stage reasoning ("thinking") control. Extended thinking (reasoning) adds latency and cost
# but improves model accuracy. Since structured stages emit JSON (deterministic), reasoning is
# disabled there by default. Synthesis (final answer) also has reasoning off by default.

# pieria.model.reasoning.structured: Enable extended thinking for all structured stages (extract/verify/classify/graph).
#   Options: true | false (default)
#   Structured stages: extraction (summarization), verification (fact-checking), classification (type/topic),
#   and graph query analysis. These emit structured JSON, so reasoning rarely adds value and increases latency.
#   Override per-stage: pieria.model.reasoning.stages.extract=true, .verify=true, .classify=true, .graph=true
pieria.model.reasoning.structured=false

# pieria.model.reasoning.synthesis: Enable extended thinking for synthesis (final answer generation).
#   Options: true | false (default)
#   Synthesis is where the final answer is assembled from retrieved memories. Reasoning can help quality
#   but adds latency. Enable only if you observe poor synthesis quality despite good retrievals.
pieria.model.reasoning.synthesis=false

# pieria.model.reasoning.disabled-effort: OpenAI reasoning_effort value for stages where reasoning is disabled.
#   Options: none (default) | minimal | low
#   - none: Fully suppresses reasoning chain (most aggressive suppression)
#   - minimal/low: Gentle suppression for reasoning-capable models (use these for OpenAI o1, o3; use none for Ollama)
#   Note: Ollama ignores reasoning_effort; the /no_think prompt token is also ignored on some models.
pieria.model.reasoning.disabled-effort=none

# pieria.model.reasoning.enabled-effort: OpenAI reasoning_effort value for stages where reasoning is enabled.
#   Options: disabled | low | medium | high (default is empty = unspecified)
#   - empty/unspecified: Model default (usually works fine)
#   - low: Quick reasoning for fast turnaround
#   - medium: Balanced reasoning
#   - high: Deep reasoning for complex tasks
#   Leave empty unless you have specific tuning needs; most models default appropriately.
pieria.model.reasoning.enabled-effort=

# Bounded retry-with-backoff for TRANSIENT model-call failures. Applies to every chat and embedding
# call, so a momentary provider blip (a rate limit, a 5xx, or the provider restarting mid-run) no
# longer aborts a long onboard: the failing call is retried in place before the exception surfaces,
# letting the batch complete and be ledgered instead of re-extracting it on the next run. Only
# transient failures retry — deterministic errors (a 400 on a bad chunk, auth/404) are never retried.
#
# pieria.model.retry.max-attempts: Total tries including the first (1 disables retry). Default 3.
pieria.model.retry.max-attempts=3
# pieria.model.retry.initial-backoff-ms: Backoff before the first retry, in milliseconds. Default 500.
pieria.model.retry.initial-backoff-ms=500
# pieria.model.retry.max-backoff-ms: Ceiling for the exponentially growing backoff. Default 8000.
pieria.model.retry.max-backoff-ms=8000
# pieria.model.retry.multiplier: Exponential growth factor per retry (>= 1.0). Default 2.0.
pieria.model.retry.multiplier=2.0
# pieria.model.retry.jitter: Randomization of each backoff as a fraction (0.2 = +/-20%), to avoid
#   synchronized retry storms across concurrent extraction workers. Default 0.2.
pieria.model.retry.jitter=0.2

# --- Source-code index (Tree-sitter) ---
# Tree-sitter is used to parse source code into a symbol and edge index during onboarding.
# This enables code-aware recall: functions, classes, and their call relationships become queryable.

# pieria.treesitter.enabled: Enable Tree-sitter source code parsing during `pieria onboard --source-code`.
#   Options: true (default) | false
#   - true: Parse repos into a symbol+edge index; enables code-aware retrieval and graph traversal
#   - false: Skip parsing; fall back to file/module facts only (useful if Tree-sitter is unavailable)
#   Native libraries (libtree-sitter and language grammars) are auto-resolved from bundled resources.
pieria.treesitter.enabled=true

# pieria.treesitter.core-path: Path to a custom libtree-sitter native library.
#   Default: auto-resolved from bundled resources (platform-specific: .so/.dylib/.dll)
#   Only set this if you need to use a sidecar copy instead of the bundled version.
#   See packaging/native/README.md for details.
#pieria.treesitter.core-path=

# pieria.treesitter.java-grammar-path: Path to a custom Tree-sitter Java grammar native library.
#   Default: auto-resolved from bundled resources
#   Only set this if you need to use a custom Java grammar (e.g., patched or forked version).
#   See packaging/native/README.md for details.
#pieria.treesitter.java-grammar-path=

# --- Code narrative summaries (LLM-synthesized) ---
# After the Tree-sitter code index, the synthesis (large) model can generate interpretive summaries:
# architecture overview, per-module descriptions, and optionally per-file summaries.
# Opt-in: summaries put the large model in the indexing path, adding latency.
# Unchanged code is never re-summarized; summaries are content-addressed and superseded by topic key.

# pieria.code.summarization.enabled: Enable LLM-based code summary generation during onboarding.
#   Options: true | false (default)
#   - true: Generate and store interpretive summaries as memories (topicKey code:summary:*)
#   - false: Skip summaries; code is indexed deterministically only
#   Can be overridden per-run: `pieria onboard --source-code --summarize` forces it on once.
pieria.code.summarization.enabled=false

# pieria.code.summarization.granularity: Level of detail for code summaries (cumulative).
#   Options: architecture (default) | module | file
#   - architecture: Repo architecture overview only
#   - module: Per-module summaries + architecture overview
#   - file: Per-file summaries + per-module summaries + architecture (most detailed, most tokens)
#   Each level adds more summaries to the index. Start with module, scale down if needed.
pieria.code.summarization.granularity=module

# pieria.code.summarization.max-source-chars-per-file: Truncate source files at this character limit.
#   When summarizing a file, only the first N characters are sent to the model.
#   Large files are truncated; use this to control prompt size and latency.
#   Default: 20000 characters (roughly 5000 tokens at ~4 chars/token)
pieria.code.summarization.max-source-chars-per-file=20000

# pieria.code.summarization.max-files-per-module-prompt: Maximum files batched into one module summary.
#   Multiple files in a module are grouped into one prompt up to this limit (by character count).
#   Higher = fewer, larger prompts. Lower = more, smaller prompts and finer-grained summaries.
#   Default: 80 files per module summary prompt
pieria.code.summarization.max-files-per-module-prompt=80

# pieria.code.summarization.max-modules-in-architecture-prompt: Maximum modules batched into architecture summary.
#   Similar to files-per-module: multiple modules grouped into one architecture prompt up to this limit.
#   Higher = fewer, larger prompts. Lower = more, smaller prompts.
#   Default: 40 modules per architecture summary prompt
pieria.code.summarization.max-modules-in-architecture-prompt=40

# --- Ingestion pipeline ---
# The write path: raw conversation → chunking → unified extraction (one model call per chunk
# emits candidates with type/topic/queries) → verification (grounded candidates skip the model
# verifier) → supersession → database → async vectorization.

# pieria.ingestion.chunk-size-chars: Target size for conversation chunks sent to extraction.
#   Memories are extracted from fixed-size chunks. Larger chunks = more context, higher cost.
#   Default: 10000 characters (roughly 2500 tokens at ~4 chars/token)
pieria.ingestion.chunk-size-chars=10000

# pieria.ingestion.chunk-overlap-messages: Number of messages to overlap between adjacent chunks.
#   Overlap preserves context across chunk boundaries, reducing missing facts at boundaries.
#   Default: 2 messages of overlap
pieria.ingestion.chunk-overlap-messages=2

# pieria.ingestion.max-extraction-concurrency: Maximum parallel extraction tasks.
#   Extraction (LLM) is the bottleneck; this limits concurrent model requests during ingestion.
#   Tune based on model throughput: higher for fast models, lower for slower ones.
#   Default: 4 concurrent extractions
pieria.ingestion.max-extraction-concurrency=4

# Evaluation-only quality gates. Zero preserves the established prompt/parser behavior. Set to
# 2 and 12 respectively only for measured onboarding benchmark variants; do not change defaults
# without satisfying docs/eval/ONBOARDING.md.
pieria.ingestion.interrogative-queries-per-memory=0
pieria.ingestion.max-extracted-candidates-per-chunk=0
pieria.ingestion.graph-from-extraction=false

# pieria.model.max-concurrent-structured-calls: Fair process-wide cap across every structured
#   extraction-tier HTTP attempt from concurrent ingests, recalls, and graph tasks. Permits cover
#   only the HTTP attempt and are released before retry backoff. Embedding/synthesis are excluded.
#   Default: 4 concurrent structured calls daemon-wide
pieria.model.max-concurrent-structured-calls=4

# pieria.ingestion.verify-mode: How extracted candidates are verified against their source chunk.
#   grounded (default): a deterministic grounding check auto-passes candidates whose words and
#     concrete values (numbers, paths) appear in the chunk; only suspect candidates go to the
#     model verifier. always: model-verify every candidate. never: trust extraction outright.
pieria.ingestion.verify-mode=grounded

# pieria.ingestion.outbox-batch-size: Batch size for vectorization tasks from the outbox.
#   Embeddings are generated in batches from the outbox queue.
#   Larger batches = higher throughput, but more memory. Tune based on embedding model capacity.
#   Default: 32 embeddings per batch
pieria.ingestion.outbox-batch-size=32

# pieria.ingestion.outbox-max-attempts: Maximum retry attempts for failed vectorization tasks.
#   If embedding fails, retry up to this many times before giving up and logging an error.
#   Default: 5 retries
pieria.ingestion.outbox-max-attempts=5

# pieria.ingestion.vectorization-scheduler-enabled: Enable the background vectorization worker.
#   Options: true (default) | false
#   - true: Background worker thread drains the vectorization outbox asynchronously
#   - false: Vectorization is skipped (recall falls back to FTS + exact key only)
#   Disable only for testing or if you don't need vector search.
pieria.ingestion.vectorization-scheduler-enabled=true

# pieria.ingestion.vectorization-interval-ms: Polling interval for vectorization worker (milliseconds).
#   The background worker wakes up every N ms to check for pending embeddings in the outbox.
#   Lower = more responsive but higher CPU wake-ups. Higher = less responsive but lower overhead.
#   Default: 5000 ms (5 seconds)
pieria.ingestion.vectorization-interval-ms=5000

# --- Retrieval pipeline ---
# The read path: query analysis → embedding + FTS → five parallel retrieval channels (FTS, exact key,
# message FTS, direct vector, HyDE vector) + graph traversal → RRF fusion → top-K results → synthesis.

# pieria.retrieval.vector-enabled: Enable vector/semantic search in retrieval.
#   Options: true (default) | false
#   - true: Use embeddings for vector-based similarity search
#   - false: Use only FTS and exact-key matching (faster but less semantic)
pieria.retrieval.vector-enabled=true

# pieria.retrieval.rrf-k: Reciprocal Rank Fusion (RRF) parameter for combining channel scores.
#   RRF blends results from all retrieval channels into a unified ranking.
#   Higher k = smoother blending (all channels weighted more equally). Lower k = steeper decay (early ranks dominate).
#   Standard value: 60. Tune if certain channels dominate unfairly.
pieria.retrieval.rrf-k=60

# pieria.retrieval.weight-exact-key: RRF weight multiplier for exact-key channel (topicKey lookup).
#   Exact matches on topicKey (e.g., "task", "instruction", "fact:budget") get this weight boost.
#   High weight (3.0) prioritizes exact matches. Reduce if exact matches are too aggressive.
pieria.retrieval.weight-exact-key=3.0

# pieria.retrieval.weight-fts-memory: RRF weight for Full-Text Search on memory content.
#   FTS on topicKey + body fields. Keyword-based relevance without embeddings.
#   Default: 1.0 (baseline weight)
pieria.retrieval.weight-fts-memory=1.0

# pieria.retrieval.weight-hyde-vector: RRF weight for Hypothetical Document Embeddings (HyDE).
#   HyDE: query → model generates hypothetical answer → embed answer → use for vector search.
#   Adds extra semantic depth at cost of model latency. Reduces if synthesis model is slow.
pieria.retrieval.weight-hyde-vector=1.0

# pieria.retrieval.weight-direct-vector: RRF weight for direct vector search (query embedding).
#   Direct embedding of the query; fastest vector search.
#   Default: 1.0 (baseline weight)
pieria.retrieval.weight-direct-vector=1.0

# pieria.retrieval.weight-fts-message: RRF weight for Full-Text Search on raw messages.
#   FTS on original conversation text (not summaries). Useful for finding exact phrases.
#   Default: 0.5 (lower weight; message FTS is less curated than memory FTS)
pieria.retrieval.weight-fts-message=0.5

# pieria.retrieval.weight-graph: RRF weight for code graph traversal channel.
#   Graph channel: entity-relation traversal (e.g., "find all functions called by X").
#   Weight 0 disables it entirely. Increases for code-heavy contexts; reduce if noisy.
pieria.retrieval.weight-graph=1.0

# pieria.retrieval.graph-depth: Maximum traversal depth for graph channel.
#   How many hops to follow in the code graph (e.g., depth=2: seed → neighbors → neighbors' neighbors).
#   Higher = more exploration, higher cost. Default: 2 hops
pieria.retrieval.graph-depth=2

# pieria.retrieval.graph-fanout: Maximum neighbors to explore per node in graph traversal.
#   At each node, follow up to N edges. Higher = broader exploration.
#   Default: 20 neighbors per node
pieria.retrieval.graph-fanout=20

# pieria.retrieval.graph-seed-limit: Maximum seed symbols for graph traversal.
#   Query analysis identifies "seed" entities (functions, classes, variables).
#   Graph channel starts traversal from the first N seeds. Default: 8 seeds
pieria.retrieval.graph-seed-limit=8

# pieria.retrieval.channel-limit: Maximum results returned per retrieval channel.
#   Each channel (FTS, vector, graph, etc.) is capped at this many results before RRF fusion.
#   Default: 10 results per channel
pieria.retrieval.channel-limit=10

# pieria.retrieval.channel-timeout-ms: Timeout (milliseconds) for each retrieval channel.
#   If a channel (especially graph traversal) takes too long, abandon it and move to fusion.
#   Prevents slow channels from blocking synthesis. Default: 3000 ms (3 seconds)
pieria.retrieval.channel-timeout-ms=3000

# --- Impact statistics ("Pieria impact" panel) ---
# Statistics reported in logs and UI to quantify memory system impact (saved tokens, cost reduction).

# pieria.stats.price-per-million-tokens: Cost per million tokens for calculating estimated savings.
#   Pieria tracks tokens retrieved and estimates cost savings vs. expanding context window.
#   Set this to your effective cost per million tokens (e.g., 3.0 for $0.003/1M tokens).
#   0.0 (default): Omit cost calculations; only report token savings.
pieria.stats.price-per-million-tokens=0.0

# pieria.stats.context-window-tokens: Context window size for "context windows saved" metric.
#   Pieria reports savings in terms of context windows (not just raw tokens).
#   This value normalizes: "saved 100k tokens = 0.5 context windows" when context-window=200k.
#   Tune to your typical model context window (e.g., 200000 for Claude, 8192 for smaller models).
pieria.stats.context-window-tokens=200000

# --- First-run setup ---
# Daemon startup behavior for model availability checks and auto-pull policies.

# pieria.first-run.check-models: Ping the provider at startup to verify models are available.
#   Options: true (default) | false
#   - true: Daemon waits for provider health check before becoming ready
#   - false: Skip health check; daemon starts even if models are unavailable
#   Useful for development; disable if your provider is slow to start.
pieria.first-run.check-models=true

# pieria.first-run.model-pull-policy: Auto-download (pull) missing models from the provider.
#   Options: never (default) | missing | always
#   - never: Do not auto-pull; expect models to be pre-installed
#   - missing: Auto-pull only if a model is missing (first use of each model)
#   - always: Always pull models on startup (useful for CI or reproducibility)
#   Applies to extraction-model, synthesis-model, and embedding model.
#   Only works with Ollama and similar providers that support `ollama pull`.
pieria.first-run.model-pull-policy=if_missing
