<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pieria · Console</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/graph.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Pieria <small id="profileLabel">Console</small></div>
    <nav class="nav" id="nav">
      <button data-view="memories" class="active">Memories</button>
      <button data-view="add">Add</button>
      <button data-view="recall">Recall</button>
      <button data-view="stats">Statistics</button>
      <button data-view="audit">Audit</button>
      <button data-view="graph">Graph</button>
    </nav>
    <div class="spacer"></div>
    <button id="exportBtn" title="Download all memories as NDJSON">⬇ Export</button>
  </div>

  <div class="content-shell">
    <aside class="side-panel is-expanded" id="sidePanel" aria-label="Console side panel">
      <div class="side-panel-scroll" id="sidePanelContent">
        <section class="side-panel-category" aria-labelledby="profilesCategoryTitle">
          <div class="side-panel-category-header" title="Profiles">
            <span class="side-panel-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 6.5C4 5.1 7.6 4 12 4s8 1.1 8 2.5S16.4 9 12 9 4 7.9 4 6.5Zm0 0v5C4 12.9 7.6 14 12 14s8-1.1 8-2.5v-5m-16 5v5C4 17.9 7.6 19 12 19s8-1.1 8-2.5v-5"/>
              </svg>
            </span>
            <span class="side-panel-category-title" id="profilesCategoryTitle">Profiles</span>
          </div>
          <ul class="side-panel-list" id="profileList" aria-live="polite">
            <li class="side-panel-status">Loading profiles…</li>
          </ul>
        </section>
      </div>
      <button class="side-panel-toggle" id="sidePanelToggle" type="button"
              aria-controls="sidePanelContent" aria-expanded="true" aria-label="Collapse side panel"
              title="Collapse side panel">
        <svg class="side-panel-toggle-collapse" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m14 6-6 6 6 6"/>
        </svg>
        <svg class="side-panel-toggle-expand" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m10 6 6 6-6 6"/>
        </svg>
        <span class="side-panel-toggle-label">Collapse</span>
      </button>
    </aside>

    <main>
    <!-- ===== Memories ===== -->
    <section class="view active" id="view-memories">
      <div class="controls">
        <input id="searchInput" class="grow" placeholder="search content, topic key, session…" autocomplete="off">
        <select id="typeFilter" title="Filter by type">
          <option value="">All types</option>
          <option value="fact">fact</option>
          <option value="event">event</option>
          <option value="instruction">instruction</option>
          <option value="task">task</option>
        </select>
        <select id="sessionFilter" title="Filter by session"><option value="">All sessions</option></select>
        <select id="sortSelect" title="Sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="type">Type</option>
          <option value="long">Longest</option>
        </select>
        <label class="check"><input type="checkbox" id="supToggle"> show superseded</label>
      </div>
      <div id="memList" class="mem-list"></div>
      <div id="memPager" class="pager"></div>
    </section>

    <!-- ===== Add ===== -->
    <section class="view" id="view-add">
      <div class="panel">
        <h2 class="section">Add a memory</h2>
        <div class="form-grid">
          <div class="field">
            <label>Type <span class="req">*</span></label>
            <select id="addType">
              <option value="fact">fact</option>
              <option value="event">event</option>
              <option value="instruction">instruction</option>
              <option value="task">task</option>
            </select>
          </div>
          <div class="field">
            <label>Topic key <span class="hint">(supersedes prior fact/instruction with same key)</span></label>
            <input id="addTopicKey" placeholder="optional, e.g. recall-latency">
          </div>
          <div class="field full">
            <label>Content <span class="req">*</span></label>
            <textarea id="addContent" placeholder="The canonical statement to remember…"></textarea>
          </div>
          <div class="field">
            <label>Session id</label>
            <input id="addSession" placeholder="optional">
          </div>
          <div class="field">
            <label>Payload (JSON)</label>
            <textarea id="addPayload" placeholder='optional, e.g. {"source":"manual"}'></textarea>
          </div>
          <div class="field full form-actions">
            <button class="primary" id="addSubmit">Store memory</button>
            <span id="addStatus" class="hint"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Recall ===== -->
    <section class="view" id="view-recall">
      <div class="controls">
        <input id="recallQuery" class="grow" placeholder="Ask a question…" autocomplete="off">
        <select id="recallMode" title="How much of the pipeline runs">
          <option value="synthesized" selected>Synthesized — full answer</option>
          <option value="analyzed">Analyzed — memories only</option>
          <option value="evidence">Evidence — fastest, memories only</option>
        </select>
        <select id="recallLimit" title="Max supporting memories">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
        <button class="primary" id="recallBtn">Ask</button>
      </div>
      <p class="hint" id="recallHint">Synthesized runs the full retrieval + synthesis pipeline. Analyzed and Evidence skip synthesis and return the supporting memories directly.</p>
      <div id="recallResult"></div>
    </section>

    <!-- ===== Stats ===== -->
    <section class="view" id="view-stats">
      <div id="statsBody"></div>
    </section>

    <!-- ===== Audit ===== -->
    <section class="view" id="view-audit">
      <div class="controls audit-controls">
        <input id="auditSearch" class="grow" placeholder="search requests, responses, ids, errors…" autocomplete="off">
        <select id="auditOperation" title="Filter by operation">
          <option value="">All operations</option>
          <option value="recall">recall</option>
          <option value="memory.remember">remember</option>
          <option value="memory.list">list memories</option>
          <option value="memory.forget">forget</option>
          <option value="ingest.transcript">transcript ingest</option>
          <option value="ingest">ingest</option>
          <option value="task.completed">task completed</option>
          <option value="onboard.async">onboard</option>
          <option value="code.index">code index</option>
          <option value="config.update">config update</option>
          <option value="export">export</option>
        </select>
        <select id="auditClient" title="Filter by caller">
          <option value="">All clients</option>
          <option value="gateway">gateway</option>
          <option value="hook">hook</option>
          <option value="cli">CLI</option>
          <option value="console">console</option>
          <option value="api">direct API</option>
        </select>
        <select id="auditHarness" title="Filter by harness">
          <option value="">All harnesses</option>
          <option value="claude-code">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="opencode">OpenCode</option>
        </select>
        <select id="auditOutcome" title="Filter by outcome">
          <option value="">All outcomes</option>
          <option value="success">success</option>
          <option value="failure">failure</option>
          <option value="cancelled">cancelled</option>
        </select>
        <label class="audit-date-field">
          <span>From</span>
          <input id="auditFrom" type="datetime-local" title="Completed at or after">
        </label>
        <label class="audit-date-field">
          <span>To</span>
          <input id="auditTo" type="datetime-local" title="Completed at or before">
        </label>
        <label class="check"><input type="checkbox" id="auditTruncated"> truncated only</label>
        <button id="auditClear">Clear</button>
      </div>
      <div id="auditList" class="audit-list"></div>
      <div id="auditPager" class="pager"></div>
    </section>

    <!-- ===== Graph ===== -->
    <section class="view" id="view-graph">
      <div class="graph-toolbar">
        <div class="graph-search">
          <input id="graphSearch" placeholder="search entities…" autocomplete="off"
                 aria-label="Search entities" aria-autocomplete="list">
          <div class="graph-search-results" id="graphSearchResults"></div>
        </div>
        <label class="graph-depth">
          <span>Depth</span>
          <select id="graphDepth" title="How many hops out from the focused entity">
            <option value="1" selected>1 hop</option>
            <option value="2">2 hops</option>
            <option value="3">3 hops</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="graphFit" title="Frame everything currently drawn">Fit</button>
        <button id="graphReset" title="Back to the profile overview">Reset</button>
      </div>

      <div class="graph-body">
        <div class="graph-stage">
          <canvas id="graphCanvas"></canvas>
          <div class="graph-hover-card" id="graphHoverCard"></div>
          <div class="graph-status-host" id="graphStatus" style="display:none"></div>

          <div class="graph-types" id="graphTypes">
            <div class="graph-types-header">
              <h4>Entity types <span class="muted" id="graphTypeSummary"></span></h4>
              <div class="graph-types-actions">
                <button id="graphTypeAll" type="button" title="Show every entity type">All</button>
                <button id="graphTypeNone" type="button" title="Hide every entity type">None</button>
              </div>
            </div>
            <div class="graph-type-list" id="graphTypeList"></div>
          </div>

          <div class="graph-footer" id="graphFooter"></div>
        </div>

        <aside class="graph-inspector" id="graphInspector" aria-label="Entity inspector">
          <header>
            <span class="chip" id="graphInspectorChip" style="display:none"></span>
            <h3 id="graphInspectorTitle"></h3>
            <span class="spacer"></span>
            <button id="graphInspectorClose" title="Clear selection" style="display:none">✕</button>
          </header>
          <div class="graph-inspector-body" id="graphInspectorBody">
            <div class="graph-inspector-status">
              Click a node to inspect it. Double-click to pull in its neighbours.
            </div>
          </div>
        </aside>
      </div>
    </section>
    </main>
  </div>

  <!-- detail drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <header>
      <span id="drawerChip"></span>
      <span class="spacer"></span>
      <button class="danger" id="drawerDelete" title="Forget this memory">🗑 Forget</button>
      <button id="drawerClose" title="Close">✕</button>
    </header>
    <div class="body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/console/main.js"></script>
</body>
</html>
