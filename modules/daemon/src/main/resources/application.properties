spring.application.name=pieria
# --- Pieria daemon ---
pieria.daemon.host=127.0.0.1
pieria.daemon.port=8077
# --- Embedded SQLite store ---
# Blank means AppDataPathResolver chooses an OS-appropriate app-data database path.
pieria.db.path=
pieria.storage.backend=sqlite
# Path to the bundled sqlite-vec `vec0` extension. Blank ⇒ auto-resolve from PIERIA_VEC_EXTENSION
# or the vec0.{dylib,so,dll} shipped beside the binary; falls back to the OS extension search path.
pieria.vec.extension-path=
# Import the user-editable config dumped to the config directory on first start. `optional:` keeps
# startup working before the file exists (first run) or on manual launches without an explicit
# config-dir. Imported values override the built-in defaults below; command-line args still win.
spring.config.import=optional:file:${pieria.app-data.config-dir}/pieria.properties
# Optional app-data overrides. Leave blank for OS defaults.
pieria.app-data.root=
pieria.app-data.database-dir=
pieria.app-data.config-dir=
pieria.app-data.logs-dir=
pieria.app-data.runtime-dir=
# --- First-run setup ---
pieria.first-run.enabled=true
pieria.first-run.check-models=true
pieria.first-run.model-pull-policy=if_missing
# --- Model provider (OpenAI-compatible API: Ollama, LM Studio, llama.cpp, vLLM, OpenRouter, OpenAI) ---
# base-url is the API root WITHOUT /v1 (the client appends it). api-key is forwarded as the bearer
# token; local providers ignore it, so any non-blank placeholder works. name is a display-only label.
pieria.provider.base-url=http://127.0.0.1:11434
pieria.provider.api-key=ollama
pieria.provider.name=ollama
# type selects the wire dialect: openai (any OpenAI-compatible endpoint) or azure (Azure OpenAI /
# Microsoft Foundry). In azure mode base-url is the resource endpoint
# (https://<resource>.openai.azure.com) and the pieria.model.* names are Azure deployment names.
pieria.provider.type=openai
# Azure REST API version; used only when type=azure.
pieria.provider.api-version=2024-10-21
# --- Model gateway ---
pieria.model.extraction-model=qwen3:8b
pieria.model.synthesis-model=gemma3:12b
pieria.model.embedding=mxbai-embed-large
pieria.model.embedding-dimension=1024
# Per-stage reasoning control: off for structured stages (extract/verify/classify/graph/query),
# on for synthesis. Uses the reasoning_effort request option; disabled stages send disabled-effort
# (none disables thinking, incl. Qwen3 over Ollama's OpenAI endpoint). Override a single stage with
# pieria.model.reasoning.stages.<stage>=true|false.
pieria.model.reasoning.structured=false
pieria.model.reasoning.synthesis=true
pieria.model.reasoning.disabled-effort=none
pieria.model.reasoning.enabled-effort=
# --- Ingestion pipeline ---
pieria.ingestion.chunk-size-chars=10000
pieria.ingestion.chunk-overlap-messages=2
pieria.ingestion.max-extraction-concurrency=4
pieria.ingestion.detail-pass-min-messages=9
pieria.ingestion.outbox-batch-size=32
pieria.ingestion.outbox-max-attempts=5
pieria.ingestion.vectorization-scheduler-enabled=true
pieria.ingestion.vectorization-interval-ms=5000
# --- Retrieval pipeline ---
pieria.retrieval.vector-enabled=true
pieria.retrieval.rrf-k=60
pieria.retrieval.weight-exact-key=3.0
pieria.retrieval.weight-fts-memory=1.0
pieria.retrieval.weight-hyde-vector=1.0
pieria.retrieval.weight-direct-vector=1.0
pieria.retrieval.weight-fts-message=0.5
# Graph channel: second-wave entity-relation traversal. weight-graph=0 disables it.
pieria.retrieval.weight-graph=1.0
pieria.retrieval.graph-depth=2
pieria.retrieval.graph-fanout=20
pieria.retrieval.graph-seed-limit=8
pieria.retrieval.channel-limit=10
pieria.retrieval.channel-timeout-ms=3000
# --- Stats display ---
# Per-tier input/output prices ($ per 1M tokens) used to cost the "Inference spend" panel of
# `pieria profile stats` (the real tokens Pieria spent). Left at 0.0 → the cost line is hidden and
# only token counts show; set them to your provider's prices to estimate run cost. Keyed by tier:
# extraction (small model), synthesis (large model), embedding. Example (uncomment + adjust):
# pieria.stats.spend.extraction.input-price=0.0
# pieria.stats.spend.extraction.output-price=0.0
# pieria.stats.spend.synthesis.input-price=0.0
# pieria.stats.spend.synthesis.output-price=0.0
# pieria.stats.spend.embedding.input-price=0.0
# pieria.stats.spend.embedding.output-price=0.0
# Per-stage model-call tracing. Raise to DEBUG to log each model call (extract/verify/classify/...)
# as it starts and finishes, with stage, model, prompt size and latency — useful for watching a slow
# onboarding ingest progress through the provider. Override in the runtime pieria.properties (no
# rebuild needed): logging.level.dev.alvo.pieria.model=DEBUG
logging.level.dev.alvo.pieria.model=INFO
# Bind the web server to localhost only (never a public interface in local mode).
server.address=${pieria.daemon.host}
server.port=${pieria.daemon.port}
# Embedded SQLite datasource (WAL is enabled by DataSourceConfig at startup).
spring.datasource.driver-class-name=org.sqlite.JDBC
# Flyway runs against the same SQLite datasource.
spring.flyway.enabled=true
# Spring AI OpenAI-compatible wiring. The chat model is pinned per-tier in ModelGatewayConfig.
# spring.ai.openai.base-url is contributed by ProviderEnvironmentPostProcessor: it appends the /v1
# API segment for the openai dialect, since the OpenAI Java SDK (Spring AI 2.0) posts to
# {base-url}/chat/completions without inserting it. Azure uses a different scheme and is left as-is.
spring.ai.openai.api-key=${pieria.provider.api-key}
spring.ai.openai.chat.options.model=${pieria.model.extraction-model}
spring.ai.openai.embedding.options.model=${pieria.model.embedding}
