# Layered ON TOP of the main application.properties (profile "test"):
# fresh throwaway DB per run (${random.uuid}) so editing an already-applied migration during
# development never trips Flyway checksum validation; never the user's home; no model pulls.
pieria.db.path=${java.io.tmpdir}/pieria-test/${random.uuid}.db
spring.ai.ollama.init.pull-model-strategy=never
# Do not run the background vectorization scheduler during tests; tests drive the worker directly.
pieria.ingestion.vectorization-scheduler-enabled=false
