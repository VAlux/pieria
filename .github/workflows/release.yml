name: release

# Builds the native daemon + gateway + cli for each supported platform and publishes
# them as GitHub Release assets in the archive layout the installers expect:
#   pieria-macos-aarch64.tar.gz   (bin/pieria-daemon, bin/pieria-gateway, bin/pieria)
#   pieria-linux-x86_64.tar.gz
#   pieria-windows-x86_64.zip     (bin\pieria-daemon.exe, ...)
#   checksums.txt                 (sha256, verified by packaging/install.{sh,ps1})
#
# Native images cannot cross-compile, so each platform builds on its own runner.
# Push a tag (v*) to cut a release; workflow_dispatch builds artifacts without
# publishing unless a tag is supplied.
#
# Job graph (all three platforms in parallel within each stage):
#
#   test ─> native-image ×3 ─> package ─> release
#
# Tests gate the native builds rather than running alongside them. The macOS daemon image takes
# 1-3 hours, so starting it against code that fails its own suite spends the single most expensive
# thing in this workflow on an artifact that can never ship — and on a tag push a test failure means
# re-tagging anyway. The cost is the ~10 minutes tests add to the front of a multi-hour critical
# path. It also drops peak concurrent macOS jobs from 4 to 3, leaving headroom under the Free plan's
# limit of 5.
#
# The three native images are compiled on three separate runners rather than in one
# `nativeDist` invocation. Every free Apple Silicon runner (macos-14/15/26/latest) is a
# 3-core/7.5GB box, and the daemon image alone wants ~5.7GB — see the memory-tuned buildArgs
# in modules/daemon/build.gradle.kts. Splitting means the daemon builder never shares a
# machine with a second native-image process or with the test suite's JVMs, and keeps each
# job far from the 6-hour per-job limit. The `package` job reassembles the binaries through
# the same :daemon:nativeDist task used locally, so the archive layout cannot drift.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0); leave blank to build only"
        required: false
        default: ""

# sqlite-vec remains fetched by the workflow; Tree-sitter pins live in the shared Gradle task.
env:
  SQLITE_VEC_VERSION: "0.1.9"

permissions:
  contents: write

jobs:
  test:
    name: test ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git bash is present on the Windows runner, unifying most steps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :daemon:embedVecExtensions stages this onto the test classpath, which is how the vector tests
      # find vec0. They are mandatory (SqliteMemoryStoreVectorTests fails rather than skips when the
      # extension is missing), so without this step every platform's suite is red.
      - name: Fetch sqlite-vec extension
        run: bash .github/scripts/fetch-sqlite-vec.sh "${{ matrix.platform }}"

      # Use the same Gradle task as deployLocal so release artifacts cannot drift from local installs.
      # Run the real grammar fixtures against those freshly built libraries with no skipped packs.
      - name: Build and test Tree-sitter language packs
        run: |
          ./gradlew :daemon:buildTreeSitterLibraries --no-daemon --stacktrace
          # Git Bash's $PWD is POSIX-style (/d/a/...) on the Windows runner; Java's Path.of()
          # would misresolve that, so use the native drive-letter form there instead.
          NATIVE_ROOT="$PWD"
          if [ "$RUNNER_OS" = "Windows" ]; then NATIVE_ROOT="$(pwd -W)"; fi
          PIERIA_TEST_NATIVE_DIR="$NATIVE_ROOT/modules/daemon/build/generated/treesitter-native/${{ matrix.platform }}" \
            ./gradlew test --no-daemon --stacktrace

      # Skips are invisible in Gradle's default output, so publish the reports: a leg that "passed"
      # by skipping its native-dependent tests should be diagnosable after the fact.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.platform }}
          path: |
            modules/*/build/reports/tests/test
            modules/*/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

  native-image:
    name: ${{ matrix.image.bin }} ${{ matrix.target.platform }}
    # `needs` is job-wide, not per-matrix-leg, so any platform's test failure stops all nine compile
    # jobs. That is the intent for a release workflow: no platform's binary should be built from a
    # tree that fails tests anywhere.
    needs: test
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          # Apple Silicon. Every free arm64 macOS label is 3 cores / 7.5GB, and native-image gets
          # only ~5.7GB of that. A larger Apple Silicon runner (macos-15-xlarge) would be the robust
          # fix but is billed; the Intel *-large runners are free with 14GB but would silently change
          # this artifact's architecture to x86_64.
          - os: macos-14
            platform: macos-aarch64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
        image:
          - module: daemon
            task: ":daemon:nativeCompile"
            bin: pieria-daemon
          - module: gateway
            task: ":gateway:nativeCompile"
            bin: pieria-gateway
          - module: cli
            task: ":cli:nativeCompile"
            bin: pieria
    steps:
      - uses: actions/checkout@v4

      # native-image needs the MSVC toolchain on Windows; export it to the job env
      # so later (bash) steps inherit cl.exe.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up GraalVM (JDK 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fetch the platform sqlite-vec loadable extension so it gets embedded into
      # the daemon image (build still succeeds without it, but vector search would
      # be disabled — a release must ship it). See packaging/native/README.md.
      - name: Fetch sqlite-vec extension
        if: matrix.image.module == 'daemon'
        run: bash .github/scripts/fetch-sqlite-vec.sh "${{ matrix.target.platform }}"

      # PIERIA_CONSTRAINED_NATIVE_BUILD switches on the memory-tuned buildArgs in
      # modules/daemon/build.gradle.kts for the memory-starved macOS leg only. GRADLE_OPTS caps
      # Gradle's own JVM so the ~1GB it would otherwise hold stays available to the native-image
      # builder forked alongside it — on a 7.5GB box that is ~18% more heap for the builder.
      - name: Compile ${{ matrix.image.bin }}
        env:
          PIERIA_CONSTRAINED_NATIVE_BUILD: ${{ runner.os == 'macOS' }}
          GRADLE_OPTS: -Xmx512m
        run: ./gradlew ${{ matrix.image.task }} --no-daemon --stacktrace

      # actions/upload-artifact does not preserve the executable bit, so the packaging job restores
      # it. Stage under a stable name first: the binary picks up .exe on Windows.
      - name: Stage binary
        run: |
          src="modules/${{ matrix.image.module }}/build/native/nativeCompile/${{ matrix.image.bin }}"
          if [ "$RUNNER_OS" = "Windows" ]; then src="${src}.exe"; fi
          mkdir -p staged
          cp "$src" staged/
          ls -l staged

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nativebin-${{ matrix.target.platform }}-${{ matrix.image.bin }}
          path: staged/*
          if-no-files-found: error

  package:
    name: package ${{ matrix.platform }}
    needs: native-image
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
            archive: tar
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # nativeDist compiles nothing in prebuilt mode, but the graalvmNative plugin is applied during
      # configuration — keep the same JDK as the compile jobs rather than risk a toolchain mismatch.
      - name: Set up GraalVM (JDK 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download this platform's binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nativebin-${{ matrix.platform }}-*
          merge-multiple: true
          path: build/native-bins

      # The upload/download round trip drops the executable bit; restore it before nativeDist stages
      # the files, or the smoke test cannot exec the daemon.
      - name: Restore executable bit
        run: |
          chmod +x build/native-bins/* || true
          ls -l build/native-bins

      # Same task as :daemon:deployLocal, so the archive layout (and the macOS ad-hoc re-signing that
      # keeps AMFI from SIGKILLing a freshly replaced binary) is defined in exactly one place.
      - name: Assemble native distribution
        run: ./gradlew :daemon:nativeDist -PprebuiltNativeBins=build/native-bins --no-daemon --stacktrace

      # The JVM suite exercises the classpath resource; nothing until now has ever *run* the native
      # image. This is where GraalVM's FFM support, xerial's own native extraction, and vec0 loading
      # from an extracted path are proven on each platform rather than assumed.
      - name: Smoke-test the native daemon
        env:
          PIERIA_SMOKE_PORT: "8078"
        run: bash .github/scripts/smoke-native.sh "${{ matrix.platform }}"

      - name: Package archive
        if: matrix.archive == 'tar'
        run: |
          mkdir -p dist
          tar -czf "dist/pieria-${{ matrix.platform }}.tar.gz" \
            -C modules/daemon/build/distributions/pieria-native bin

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path modules/daemon/build/distributions/pieria-native/bin `
            -DestinationPath "dist/pieria-${{ matrix.platform }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    # Tests are gated transitively (test -> native-image -> package).
    needs: package
    runs-on: ubuntu-latest
    # Publish only for a tag push or a dispatch that supplied a tag.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
