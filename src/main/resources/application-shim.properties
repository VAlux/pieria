# MCP stdio shim launch mode (SPEC 10.1, phase-4 step 3).
# Activated by the `shim` profile (see PieriaApplication --mcp-shim, or -Dspring.profiles.active=shim).
# The shim is a pure stdio MCP server + localhost HTTP client to the daemon; it must NOT boot the
# web server, datasource, Flyway, or the model gateway. Daemon beans are kept out by @Profile("!shim").

# No embedded web server: the shim talks MCP over stdio, not HTTP-in.
spring.main.web-application-type=none

# stdio MCP server: keep the banner and console logging off stdout so the framed MCP protocol on
# stdout stays clean (logs go to stderr / file only).
spring.main.banner-mode=off
logging.pattern.console=

# Identify this jar as an MCP server toward the harness.
spring.ai.mcp.server.name=pieria
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true

# Where the daemon listens (defaults derive from pieria.daemon.host/port if unset).
pieria.shim.daemon-url=http://${pieria.daemon.host:127.0.0.1}:${pieria.daemon.port:8077}

# Exclude daemon-only infrastructure autoconfig so the shim never opens the embedded DB or
# initializes the Ollama model clients.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
