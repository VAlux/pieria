# Pieria configuration
#
# This file was written to your config directory on first daemon start. Edit it to
# customize the daemon, then restart Pieria for the changes to take effect.
#
# Precedence: values here override the daemon's built-in defaults, but are themselves
# overridden by command-line arguments the installed service passes (host, port, paths).
# Delete this file to fall back to the built-in defaults.
#
# Only the commonly-tuned settings are listed below. Any pieria.* property accepted by
# the daemon can be added here.

# --- Model provider (OpenAI-compatible API: Ollama, LM Studio, llama.cpp, vLLM, OpenRouter, OpenAI) ---
# base-url is the API root WITHOUT /v1 (the client appends it). api-key is forwarded as the bearer
# token; local providers ignore it, so any non-blank placeholder works. name is a display-only label.
pieria.provider.base-url=http://127.0.0.1:11434
pieria.provider.api-key=ollama
pieria.provider.name=ollama
# type selects the wire dialect: openai (any OpenAI-compatible endpoint) or azure (Azure OpenAI /
# Microsoft Foundry). In azure mode base-url is the resource endpoint
# (https://<resource>.openai.azure.com) and the pieria.model.* names are Azure deployment names.
pieria.provider.type=openai
# Azure REST API version; used only when type=azure.
pieria.provider.api-version=2024-10-21

# --- Models ---
# Small/fast model drives the structured stages (extract/verify/classify); the large model is used
# for synthesis only. embedding-dimension fixes the vector column width: changing it after memories
# have been embedded requires re-embedding, so decide it once.
pieria.model.extraction-model=qwen3:8b
pieria.model.synthesis-model=gemma3:12b
pieria.model.embedding=mxbai-embed-large
pieria.model.embedding-dimension=1024

# Per-stage reasoning ("thinking") control. Reasoning is wasted latency/cost on the structured
# stages (extract/verify/classify/graph/query-analysis), which emit JSON — so it is off there by
# default — and off for synthesis as well by default. Control is the OpenAI reasoning_effort request
# option: disabled stages send disabled-effort (none fully suppresses the reasoning chain, including
# for Qwen3 over Ollama's OpenAI-compatible endpoint, which ignores the /no_think prompt token);
# enabled stages send enabled-effort if set, else nothing. The option is harmless to non-reasoning
# models (Ollama ignores it); for OpenAI reasoning models use minimal/low rather than none. Flip a
# whole tier, or override one stage by name:
#   pieria.model.reasoning.structured=true
#   pieria.model.reasoning.stages.verify=true
# synthesis is off by default: the reasoning chain over already-retrieved memories rarely earns its
# latency. Set pieria.model.reasoning.synthesis=true to re-enable it.
pieria.model.reasoning.structured=false
pieria.model.reasoning.synthesis=false
pieria.model.reasoning.disabled-effort=none
pieria.model.reasoning.enabled-effort=

# --- Source-code index (Tree-sitter) ---
# `pieria onboard --source-code` parses repos with Tree-sitter (jtreesitter/FFM) into a symbol+edge
# index. enabled=false turns parsing off entirely (the index then degrades to file/module facts). The
# core libtree-sitter and per-language grammar native libs are auto-resolved from the bundled
# resources; set the *-path overrides only to point at sidecar copies. See packaging/native/README.md.
pieria.treesitter.enabled=true
#pieria.treesitter.core-path=
#pieria.treesitter.java-grammar-path=

# --- Ingestion pipeline ---
pieria.ingestion.chunk-size-chars=10000
pieria.ingestion.chunk-overlap-messages=2
pieria.ingestion.max-extraction-concurrency=4
pieria.ingestion.detail-pass-min-messages=9
pieria.ingestion.outbox-batch-size=32
pieria.ingestion.outbox-max-attempts=5
pieria.ingestion.vectorization-scheduler-enabled=true
pieria.ingestion.vectorization-interval-ms=5000

# --- Retrieval pipeline ---
pieria.retrieval.vector-enabled=true
pieria.retrieval.rrf-k=60
pieria.retrieval.weight-exact-key=3.0
pieria.retrieval.weight-fts-memory=1.0
pieria.retrieval.weight-hyde-vector=1.0
pieria.retrieval.weight-direct-vector=1.0
pieria.retrieval.weight-fts-message=0.5
# Graph channel: second-wave entity-relation traversal. weight-graph=0 disables it.
pieria.retrieval.weight-graph=1.0
pieria.retrieval.graph-depth=2
pieria.retrieval.graph-fanout=20
pieria.retrieval.graph-seed-limit=8
pieria.retrieval.channel-limit=10
pieria.retrieval.channel-timeout-ms=3000

# --- Impact statistics ("Pieria impact" panel) ---
# price-per-million-tokens converts estimated saved tokens into an approximate cost figure;
# 0.0 omits the cost line. context-window-tokens expresses savings as a number of windows.
pieria.stats.price-per-million-tokens=0.0
pieria.stats.context-window-tokens=200000

# --- First-run setup ---
# check-models pings the provider at startup; model-pull-policy is never|missing|always.
pieria.first-run.check-models=true
pieria.first-run.model-pull-policy=if_missing
